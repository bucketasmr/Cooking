<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Chef Generator</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --label-color: #b0b0b0;
            --border-color: #333333;
            --input-bg: #2a2a2a;
            --result-bg: #181818;
            --top-btn-bg: #333333;
            --top-btn-color: #e0e0e0;
        }

        [data-theme="light"] {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #222222;
            --label-color: #555555;
            --border-color: #eeeeee;
            --input-bg: #ffffff;
            --result-bg: #fafafa;
            --top-btn-bg: #e0e0e0;
            --top-btn-color: #333333;
        }

        [data-theme="paper"] {
            --bg-color: #f3efe6;
            --card-bg: #faf6ef;
            --text-color: #4a3b32;
            --label-color: #6e5d53;
            --border-color: #e4dcd0;
            --input-bg: #fffdf9;
            --result-bg: #f4eee6;
            --top-btn-bg: #e2d8cc;
            --top-btn-color: #4a3b32;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            max-width: 600px; 
            margin: 20px auto; 
            padding: 15px; 
            background: var(--bg-color); 
            color: var(--text-color);
            -webkit-text-size-adjust: 100%;
            transition: background 0.3s, color 0.3s;
        }
        .card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
            position: relative;
            transition: background 0.3s;
        }
        .top-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 6px;
        }
        .top-btn {
            background: var(--top-btn-bg);
            color: var(--top-btn-color);
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .top-btn:active { opacity: 0.8; }
        h2 { margin-top: 0; padding-right: 170px; font-size: 22px; color: var(--text-color); }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }
        label { font-weight: 600; color: var(--label-color); }
        select {
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
        }
        textarea { 
            width: 100%; 
            height: 90px; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid var(--border-color); 
            background: var(--input-bg);
            color: var(--text-color);
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 16px;
            font-family: inherit;
        }
        button.action-btn { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 14px; 
            width: 100%;
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            margin-top: 10px;
        }
        button.action-btn:active { background: #43a047; }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .result-header h3 {
            margin: 0;
            font-size: 18px;
            color: var(--text-color);
        }
        .copy-btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .copy-btn:active { background: #1976D2; }
        .copy-btn.copied { background: #4CAF50; }
        #result { 
            margin-top: 10px; 
            white-space: pre-wrap; 
            background: var(--result-bg); 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-color);
        }
        #debug-console {
            display: none;
            margin-top: 20px;
            background: #111111;
            color: #00ffcc;
            font-family: monospace;
            font-size: 12px;
            padding: 12px;
            border-radius: 8px;
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
            border: 1px solid #333;
        }
        .log-entry { margin-bottom: 6px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .log-error { color: #ff5555; }
        .log-info { color: #55ffff; }
    </style>
</head>
<body data-theme="dark">

<div class="card">
    <div class="top-buttons">
        <button class="top-btn" id="themeToggle" onclick="toggleTheme()" title="Change theme">🌙 Dark</button>
        <button class="top-btn" id="langToggle" onclick="toggleLanguage()">ENG</button>
        <button class="top-btn" onclick="toggleDebug()">Logs</button>
    </div>
    
    <h2 id="uiTitle">Family Recipe Generator</h2>
    
    <div class="control-row">
        <label for="ingredients" id="uiLabel">All kitchen ingredients:</label>
        <select id="recipeCount">
            <option value="1">1 dish</option>
            <option value="5">5 dishes</option>
            <option value="10">10 dishes</option>
        </select>
    </div>
    <textarea id="ingredients" placeholder="e.g. chicken breast, broccoli, rice, garlic, tomatoes, cheese..."></textarea>

    <button class="action-btn" id="uiButton" onclick="generateRecipe()">Get Recipe</button>

    <div class="result-header">
        <h3 id="uiResultTitle">Result:</h3>
        <button class="copy-btn" id="copyBtn" onclick="copyRecipe()" style="display:none;">Copy</button>
    </div>
    <div id="result">Your recipe will appear here...</div>

    <div id="debug-console">
        <div class="log-info">[System] Debug console initialized.</div>
    </div>
</div>

<script>
    let currentLang = 'en';
    const themes = ['dark', 'light', 'paper'];
    const themeNames = {
        en: { dark: '🌙 Dark', light: '☀️ Light', paper: '📜 Paper' },
        ru: { dark: '🌙 Темная', light: '☀️ Белая', paper: '📜 Бумажная' }
    };

    function toggleTheme() {
        const body = document.body;
        const currentTheme = body.getAttribute('data-theme') || 'dark';
        const nextTheme = themes[(themes.indexOf(currentTheme) + 1) % themes.length];
        body.setAttribute('data-theme', nextTheme);
        updateThemeButton();
        logDebug(`Theme changed to: ${nextTheme}`);
    }

    function updateThemeButton() {
        const currentTheme = document.body.getAttribute('data-theme') || 'dark';
        const themeBtn = document.getElementById('themeToggle');
        themeBtn.textContent = themeNames[currentLang][currentTheme];
    }

    function logDebug(message, isError = false) {
        const consoleEl = document.getElementById('debug-console');
        const time = new Date().toLocaleTimeString();
        const div = document.createElement('div');
        div.className = 'log-entry ' + (isError ? 'log-error' : '');
        div.textContent = `[${time}] ${message}`;
        consoleEl.prepend(div);
        console.log(message);
    }

    function toggleDebug() {
        const consoleEl = document.getElementById('debug-console');
        consoleEl.style.display = consoleEl.style.display === 'block' ? 'none' : 'block';
    }

    window.onerror = function(msg, url, line) {
        logDebug(`Global Error: ${msg} at line ${line}`, true);
        return false;
    };

    const translations = {
        en: {
            title: "Family Recipe Generator",
            label: "All kitchen ingredients:",
            placeholder: "e.g. chicken breast, broccoli, rice, garlic, tomatoes...",
            button: "Get Recipe",
            resultTitle: "Result:",
            defaultResult: "Your recipe will appear here...",
            loading: "Preparing recipes... Please wait.",
            emptyAlert: "Please enter ingredients!",
            errorPrefix: "Error: ",
            serverError: "Connection error with server.",
            copy: "Copy",
            copied: "Copied!",
            langBtn: "ENG",
            options: { "1": "1 dish", "5": "5 dishes", "10": "10 dishes" }
        },
        ru: {
            title: "Генератор семейных рецептов",
            label: "Все продукты с кухни:",
            placeholder: "например: курица, рис, капуста, помидоры, сыр...",
            button: "Получить рецепты",
            resultTitle: "Результат:",
            defaultResult: "Здесь появятся ваши рецепты...",
            loading: "Готовим рецепты... Пожалуйста, подождите.",
            emptyAlert: "Пожалуйста, введите ингредиенты!",
            errorPrefix: "Ошибка: ",
            serverError: "Ошибка соединения с сервером.",
            copy: "Копировать",
            copied: "Скопировано!",
            langBtn: "RU",
            options: { "1": "1 блюдо", "5": "5 блюд", "10": "10 блюд" }
        }
    };

    function updateSelectOptions() {
        const select = document.getElementById('recipeCount');
        const opts = translations[currentLang].options;
        Array.from(select.options).forEach(opt => {
            if (opts[opt.value]) {
                opt.text = opts[opt.value];
            }
        });
    }

    function toggleLanguage() {
        currentLang = currentLang === 'en' ? 'ru' : 'en';
        const t = translations[currentLang];
        document.getElementById('langToggle').textContent = t.langBtn;
        updateThemeButton();
        updateSelectOptions();
        
        document.getElementById('uiTitle').textContent = t.title;
        document.getElementById('uiLabel').textContent = t.label;
        document.getElementById('ingredients').placeholder = t.placeholder;
        document.getElementById('uiButton').textContent = t.button;
        document.getElementById('uiResultTitle').textContent = t.resultTitle;
        
        const copyBtn = document.getElementById('copyBtn');
        if (copyBtn.style.display !== 'none' && !copyBtn.classList.contains('copied')) {
            copyBtn.textContent = t.copy;
        }

        const prevLangDefault = currentLang === 'en' ? translations.ru.defaultResult : translations.en.defaultResult;
        const resultDiv = document.getElementById('result');
        if (resultDiv.textContent === prevLangDefault || resultDiv.textContent.includes('Your recipe') || resultDiv.textContent.includes('Здесь появятся')) {
            resultDiv.textContent = t.defaultResult;
        }
    }

    function copyRecipe() {
        const resultDiv = document.getElementById('result');
        const textToCopy = resultDiv.textContent;
        const t = translations[currentLang];

        navigator.clipboard.writeText(textToCopy).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.textContent = t.copied;
            copyBtn.classList.add('copied');
            logDebug('Recipe copied to clipboard.');

            setTimeout(() => {
                copyBtn.textContent = t.copy;
                copyBtn.classList.remove('copied');
            }, 2000);
        }).catch(err => {
            logDebug('Failed to copy: ' + err, true);
        });
    }

    async function generateRecipe() {
        const ingredients = document.getElementById('ingredients').value.trim();
        const count = document.getElementById('recipeCount').value;
        const resultDiv = document.getElementById('result');
        const copyBtn = document.getElementById('copyBtn');
        const t = translations[currentLang];

        if (!ingredients) {
            alert(t.emptyAlert);
            return;
        }

        resultDiv.textContent = t.loading;
        copyBtn.style.display = 'none';
        logDebug(`Sending request with ingredients: "${ingredients}", count: ${count}, lang: ${currentLang}`);

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ingredients, lang: currentLang, count })
            });

            logDebug(`Response status: ${response.status} ${response.statusText}`);

            let data;
            const textResponse = await response.text();
            try {
                data = JSON.parse(textResponse);
            } catch (e) {
                logDebug(`Failed to parse JSON response: ${textResponse.slice(0, 100)}`, true);
                throw new Error('Server returned non-JSON response (status ' + response.status + ')');
            }

            if (response.ok) {
                const textContent = data.recipe || JSON.stringify(data, null, 2);
                resultDiv.textContent = textContent;
                copyBtn.style.display = 'block';
                copyBtn.textContent = t.copy;
                logDebug('Recipe generated successfully.');
            } else {
                const errMsg = data.error || 'Failed to generate';
                resultDiv.textContent = t.errorPrefix + errMsg;
                copyBtn.style.display = 'none';
                logDebug(`Server API error: ${errMsg}`, true);
            }
        } catch (error) {
            console.error(error);
            resultDiv.textContent = t.serverError;
            copyBtn.style.display = 'none';
            logDebug(`Fetch exception: ${error.message}`, true);
        }
    }

    updateSelectOptions();
</script>

</body>
</html>
